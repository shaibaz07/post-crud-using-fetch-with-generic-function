<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>post crud using fetch with genric function</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
     <link rel="stylesheet" href="./assets/css/style.css">
</head> 

<body>
    <h1 class="text-center text-white bg-success">Post Crud using fetch with Generic Function</h1>

    <div class="container-fluid">

        <div class="row mt-4">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-body">
                        <form id="postForm">
                            <div class="form-group">
                                <label for="title">Title</label>
                                <input required type="text" class="form-control" id="title">
                            </div>
                            <div class="form-group">

                                <label for="author">Author</label>
                                <input required type="text" id="author" class="form-control">

                                <label for="content">content</label>
                                <textarea required class="form-control" id="content"></textarea>
                            </div>


                            <button id="addPostBtn" class="btn btn-outline-primary btn-sm btn-block">Add
                                Post</button>
                            <button type="button" id="updatePostBtn"
                                class="btn btn-primary btn-sm btn-block d-none">Update Post</button>


                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4" id="postContainer">
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-success">
                        <h3>
                            Haseeb
                        </h3>
                    </div>
                    <div class="card-body">
                        <h5>Haseeb:</h5>
                        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Aperiam laborum reprehenderit
                            non neque aut officiis explicabo, iusto ratione dolores, aliquid adipisci corporis
                            officia asperiores quod quo repellendus at sed nihil.
                        </p>
                    </div>
                    <div class="card-footer d-flex justify-content-between">
                        <button class="btn btn-primary btn-sm">Edit</button>
                        <button class="btn btn-danger btn-sm">Remove</button>

                    </div>
                </div>
            </div>
        </div>


    </div>

     <div id="spinner" class=" d-none spinner">
        <div class="spinner-border text-secondary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
